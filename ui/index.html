<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>mathterm</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="vendor/katex.min.css">
  <style>
    :root { --bg: #1e1e1e; --fg: #ffffff; --dim: #555753; --status-bg: #2e3436; --font-size: 14px; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    #term { height: 100%; padding: 4px; box-sizing: border-box; }
    .auto-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
    .auto-math { position: absolute; left: 0; top: 0; font-size: var(--font-size); } /* placed by transform */
    .auto-math > div { position: absolute; left: 0; top: 50%; white-space: nowrap; transform-origin: left center; }
    .auto-math.block > div { left: 50%; transform-origin: center; }
    .auto-math > .auto-text { transform: translateY(-50%); white-space: pre; }
    .auto-math .katex-display { margin: 0; }
    .auto-math > .auto-flow { top: 0; width: 100%; transform: none; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auto-inline { display: inline-block; position: relative; vertical-align: top; }
    .auto-inline > div { position: absolute; left: 0; top: 50%; white-space: nowrap; text-indent: 0; transform-origin: left center; }
    #status { position: fixed; left: 6px; bottom: 6px; max-width: 80%; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; padding: 3px 8px; border-radius: 4px; background: var(--status-bg); color: var(--fg);
              font: 12px -apple-system, sans-serif; pointer-events: none; z-index: 10; }
    #status[hidden] { display: none; }
    #find { position: fixed; top: 8px; right: 12px; z-index: 10; display: flex; align-items: center; gap: 8px;
            padding: 4px 8px; border-radius: 6px; background: var(--status-bg); color: var(--fg);
            font: 12px -apple-system, sans-serif; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
    #find[hidden] { display: none; }
    #find input { width: 200px; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; }
    #find .count { color: var(--dim); min-width: 3em; text-align: right; }
  </style>
</head>
<body>
  <div id="term"></div>
  <div id="status" hidden></div>
  <div id="find" hidden><input placeholder="Find" spellcheck="false"><span class="count"></span></div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="themes.js"></script>
  <script src="clipboard.js"></script>
  <script src="renderer.js"></script>
  <script src="automath.js"></script>
</body>
</html>
